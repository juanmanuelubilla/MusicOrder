[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musicfusion"
version = "0.1.0"
description = "MusicFusion Pro - Professional music library manager for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "MusicFusion Pro", email = "dev@musicfusion.local" }]
keywords = ["music", "library", "metadata", "audio", "duplicates", "qt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "mutagen>=1.47",
    "rapidfuzz>=3.0",
    "Pillow>=10.0",
    "watchdog>=4.0",
    "tqdm>=4.66",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "requests>=2.31",
    "pyacoustid>=1.3",
]

[project.optional-dependencies]
analysis = ["numpy>=1.26", "scipy>=1.11", "librosa>=0.10"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-qt>=4.2"]
dev = ["ruff>=0.4", "mypy>=1.10", "sphinx>=7.0"]

[project.scripts]
musicfusion = "musicfusion.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["src/musicfusion/ui/", "src/musicfusion/worker/"]